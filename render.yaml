services:
  - type: web
    name: be-todo
    env: docker
    image:
      url: docker.io/norbu07/todo-backend:latest
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: todo-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: todo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: todo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: todo-db
          property: database
      - key: DB_PORT
        value: 5432

  - type: web
    name: fe-todo
    env: docker
    image:
      url: docker.io/norbu07/todo-frontend:latest
    region: oregon
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://be-todo.onrender.com

databases:
  - name: todo-db
    databaseName: todo_db
    user: todo_user
    plan: free